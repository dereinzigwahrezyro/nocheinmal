```html
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

:root{
  --bg:#080808;
  --card:rgba(255,255,255,0.03);
  --border:rgba(255,255,255,0.09);
  --accent:#ffffff;
  --accent2:#cccccc;
  --glow:rgba(255,255,255,0.35);
  --text:#f0f0f0;
  --muted:rgba(255,255,255,0.5);
}

html,body{
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:'Syne',sans-serif;
  overflow:hidden;
  cursor:none!important;
}

/* CURSOR */
#star-cursor{
  position:fixed;
  width:24px;height:24px;
  pointer-events:none;
  z-index:999999;
  transform:translate(-50%,-50%);
}
#star-cursor svg{
  width:100%;height:100%;
  filter:drop-shadow(0 0 6px #fff);
}

/* CARD */
.scene{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}
.card{
  width:420px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:24px;
  padding:30px;
  backdrop-filter:blur(20px);
}

/* TOP */
.top-row{
  display:flex;
  gap:15px;
  align-items:center;
}
.avatar{
  width:70px;height:70px;border-radius:50%;
  border:2px solid #fff;
}
.username{
  font-size:1.4rem;
  font-weight:800;
}
.status{
  font-size:.7rem;
  color:var(--muted);
}

/* PLAYER */
.player-row{
  display:flex;
  gap:14px;
  margin-top:25px;
  align-items:center;
  background:#111;
  padding:12px;
  border-radius:14px;
}

.cover{
  width:70px;
  height:70px;
  border-radius:12px;
  object-fit:cover;
}

.track-info{flex:1;}

.track-title{font-weight:700;font-size:.9rem;}
.track-artist{font-size:.7rem;color:#aaa;}

.controls{
  display:flex;
  gap:10px;
  margin-top:8px;
}
.controls button{
  background:none;border:none;color:#fff;
  font-size:16px;cursor:pointer;
}

.progress-wrap{
  height:4px;
  background:#333;
  border-radius:10px;
  margin-top:8px;
}
.progress-bar{
  height:100%;
  width:0%;
  background:#fff;
}

/* FOOTER */
.footer{
  margin-top:25px;
  text-align:center;
  font-size:.7rem;
  color:var(--muted);
}
</style>
</head>

<body>

<div id="star-cursor">
<svg viewBox="0 0 24 24">
<polygon points="12,2 15,8 22,9 17,14 18,21 12,17 6,21 7,14 2,9 9,8"/>
</svg>
</div>

<div class="scene">
<div class="card">

<div class="top-row">
<img class="avatar" id="avatar">
<div>
<div class="username" id="username"></div>
<div class="status">online</div>
</div>
</div>

<!-- PLAYER -->
<div class="player-row">
<img id="coverImg" class="cover">

<div class="track-info">
<div id="trackTitle" class="track-title"></div>
<div id="trackArtist" class="track-artist"></div>

<div class="progress-wrap" onclick="seekAudio(event)">
<div id="progressBar" class="progress-bar"></div>
</div>

<div class="controls">
<button onclick="prevTrack()">⏮</button>
<button onclick="togglePlay()" id="playBtn">▶</button>
<button onclick="nextTrack()">⏭</button>
</div>
</div>
</div>

<div class="footer">
✦ profile ✦ • views: <span id="viewCount">0</span>
</div>

</div>
</div>

<audio id="audioEl"></audio>

<script>
const CONFIG={
username:"zyro",
avatar:"cat3.jpg",
tracks:[
{
title:"God like",
artist:"summrs",
src:"God_Like_KLICKAUD.mp3",
cover:"cover1.jpg"
},
{
title:"Fighting my Demons",
artist:"Ken Carson",
src:"Fighting.mp3",
cover:"cover2.jpg"
}
]
};

/* INIT */
username.textContent=CONFIG.username;
avatar.src=CONFIG.avatar;

let idx=0,playing=false;
const audio=document.getElementById("audioEl");

function loadTrack(i){
let t=CONFIG.tracks[i];
trackTitle.textContent=t.title;
trackArtist.textContent=t.artist;
coverImg.src=t.cover;
audio.src=t.src;
}
loadTrack(0);

/* CONTROLS */
function togglePlay(){
playing=!playing;
if(playing){
audio.play();
playBtn.textContent="⏸";
}else{
audio.pause();
playBtn.textContent="▶";
}
}

function nextTrack(){idx=(idx+1)%CONFIG.tracks.length;loadTrack(idx);togglePlay();}
function prevTrack(){idx=(idx-1+CONFIG.tracks.length)%CONFIG.tracks.length;loadTrack(idx);togglePlay();}

/* PROGRESS */
audio.ontimeupdate=()=>{
if(audio.duration){
progressBar.style.width=(audio.currentTime/audio.duration*100)+"%";
}
};

function seekAudio(e){
if(!audio.duration)return;
let r=e.currentTarget.getBoundingClientRect();
audio.currentTime=((e.clientX-r.left)/r.width)*audio.duration;
}

/* CURSOR */
const cursor=document.getElementById("star-cursor");
document.addEventListener("mousemove",e=>{
cursor.style.left=e.clientX+"px";
cursor.style.top=e.clientY+"px";
});

/* VIEW COUNTER */
let views=localStorage.getItem("views")||0;
views++;
localStorage.setItem("views",views);
document.getElementById("viewCount").textContent=views;
</script>

</body>
</html>
