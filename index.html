```html
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

:root{
  --bg:#080808;
  --card:rgba(255,255,255,0.03);
  --border:rgba(255,255,255,0.1);
  --accent:#fff;
  --text:#f0f0f0;
  --muted:rgba(255,255,255,0.5);
}

body{
  height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:'Syne',sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* CARD */
.card{
  width:420px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:25px;
}

/* TOP */
.top{
  display:flex;
  align-items:center;
  gap:15px;
}

.avatar{
  width:65px;
  height:65px;
  border-radius:50%;
  border:2px solid #fff;
}

.username{
  font-weight:800;
  font-size:1.4rem;
}

.status{
  font-size:.7rem;
  color:var(--muted);
}

/* PLAYER */
.player{
  display:flex;
  gap:14px;
  margin-top:20px;
  background:#111;
  padding:12px;
  border-radius:14px;
}

.cover{
  width:64px;
  height:64px;
  border-radius:10px;
  object-fit:cover;
}

.player-info{
  flex:1;
}

.track-title{
  font-size:.9rem;
  font-weight:700;
}

.track-artist{
  font-size:.7rem;
  color:#aaa;
}

.controls{
  display:flex;
  gap:10px;
  margin-top:6px;
}

.controls button{
  background:none;
  border:none;
  color:#fff;
  font-size:16px;
  cursor:pointer;
}

.progress{
  height:4px;
  background:#333;
  border-radius:10px;
  margin-top:6px;
}

.bar{
  height:100%;
  width:0%;
  background:#fff;
}

/* FOOTER */
.footer{
  margin-top:20px;
  text-align:center;
  font-size:.7rem;
  color:var(--muted);
}
</style>
</head>

<body>

<div class="card">

  <div class="top">
    <img class="avatar" id="avatar">
    <div>
      <div class="username" id="username"></div>
      <div class="status">online</div>
    </div>
  </div>

  <div class="player">
    <img id="cover" class="cover">
    <div class="player-info">
      <div id="title" class="track-title"></div>
      <div id="artist" class="track-artist"></div>

      <div class="progress" onclick="seek(event)">
        <div class="bar" id="bar"></div>
      </div>

      <div class="controls">
        <button onclick="prev()">⏮</button>
        <button onclick="play()" id="playBtn">▶</button>
        <button onclick="next()">⏭</button>
      </div>
    </div>
  </div>

  <div class="footer">
    ✦ profile ✦ • views: <span id="views">0</span>
  </div>

</div>

<audio id="audio"></audio>

<script>
/* CONFIG */
const CONFIG={
  name:"zyro",
  avatar:"cat3.jpg",
  tracks:[
    {
      title:"God like",
      artist:"summrs",
      src:"God_Like_KLICKAUD.mp3",
      cover:"cover1.jpg"
    },
    {
      title:"Fighting my Demons",
      artist:"Ken Carson",
      src:"Fighting.mp3",
      cover:"cover2.jpg"
    }
  ]
};

/* INIT */
username.textContent=CONFIG.name;
avatar.src=CONFIG.avatar;

let i=0, playing=false;
const audio=document.getElementById("audio");

/* LOAD */
function load(){
  let t=CONFIG.tracks[i];
  title.textContent=t.title;
  artist.textContent=t.artist;
  cover.src=t.cover;
  audio.src=t.src;
}
load();

/* CONTROLS */
function play(){
  playing=!playing;
  if(playing){
    audio.play();
    playBtn.textContent="⏸";
  }else{
    audio.pause();
    playBtn.textContent="▶";
  }
}

function next(){ i=(i+1)%CONFIG.tracks.length; load(); play(); }
function prev(){ i=(i-1+CONFIG.tracks.length)%CONFIG.tracks.length; load(); play(); }

/* PROGRESS */
audio.ontimeupdate=()=>{
  bar.style.width=(audio.currentTime/audio.duration*100)+"%";
}

function seek(e){
  let r=e.currentTarget.getBoundingClientRect();
  audio.currentTime=((e.clientX-r.left)/r.width)*audio.duration;
}

/* VIEW COUNTER */
let v=localStorage.getItem("views")||0;
v++;
localStorage.setItem("views",v);
views.textContent=v;
</script>

</body>
</html>
```
